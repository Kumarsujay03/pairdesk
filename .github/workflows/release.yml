name: release
on:
  push:
    tags: ["v*"]
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
      GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Import signing key
        if: env.HAS_GPG == 'true'
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
        env: { GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }} }
      - name: Release (signed)
        if: env.HAS_GPG == 'true'
        uses: goreleaser/goreleaser-action@v6
        with: { version: "~> v2", args: release --clean }
      - name: Release (unsigned, no GPG secret configured)
        if: env.HAS_GPG != 'true'
        uses: goreleaser/goreleaser-action@v6
        with: { version: "~> v2", args: release --clean --skip=sign }
