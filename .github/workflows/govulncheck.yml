name: govulncheck
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "41 6 * * *" }]
jobs:
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
